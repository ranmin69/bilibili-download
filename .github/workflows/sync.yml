name: Sync to Gitee

on:
  push:
    branches:
      - main    # 如果你的默认分支叫 master，请改成 master
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 拉取所有历史记录，保证镜像完整

      - name: Mirror to Gitee
        uses: wearerequired/git-mirror-action@master
        env:
          # 必须和你在 GitHub Secrets 里设置的名称一模一样
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
        with:
          # ⚠️ 换成你的真实地址
          source-repo: git@github.com:ranmin69/bilibili-download.git
          # ⚠️ 换成你的真实地址（假设 Gitee 用户名也是 ranmin69，仓库名一样）
          destination-repo: git@gitee.com:ranmin69/bilibili-download.git
